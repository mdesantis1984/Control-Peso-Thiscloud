version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    container_name: controlpeso-postgres
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=controlpeso
      - POSTGRES_USER=controlpeso
      # POSTGRES_PASSWORD comes from the environment or a gitignored .env / docker-compose.override.yml
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see docs/DEPLOYMENT.md)}
    volumes:
      - controlpeso-pgdata:/var/lib/postgresql/data
    networks:
      - controlpeso-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlpeso -d controlpeso"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      com.controlpeso.service: "database"
      com.controlpeso.version: "1.0.0"

  # ============================================
  # Control Peso Web Application
  # ============================================
  controlpeso-web:
    container_name: controlpeso-web
    # IMPORTANTE: NO usar build aquí - imagen debe pre-construirse localmente con docker build
    # Comando para construir: docker build -t controlpeso-web:latest -f Dockerfile .
    image: controlpeso-web:latest
    ports:
      - "8080:8080"  # HTTP
    environment:
      # ASP.NET Core Configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      # Data Protection keys path (for antiforgery tokens and auth cookies persistence)
      - DataProtection__Path=/app/keys

      # Database Connection (PostgreSQL in Docker, Npgsql)
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=controlpeso;Username=controlpeso;Password=${POSTGRES_PASSWORD}
      # POSTGRES_PASSWORD debe configurarse en el entorno o en un .env local (NOT in Git)

      # Logging Configuration (ThisCloud.Framework)
      - ThisCloud__Loggings__IsEnabled=true
      - ThisCloud__Loggings__MinimumLevel=Information
      - ThisCloud__Loggings__Console__Enabled=true
      - ThisCloud__Loggings__File__Enabled=true
      - ThisCloud__Loggings__File__Path=/app/logs/controlpeso-.ndjson
      - ThisCloud__Loggings__File__RollingFileSizeMb=10
      - ThisCloud__Loggings__File__RetainedFileCountLimit=30
      - ThisCloud__Loggings__File__UseCompactJson=true
      - ThisCloud__Loggings__Redaction__Enabled=true
      - ThisCloud__Loggings__Correlation__HeaderName=X-Correlation-Id
      - ThisCloud__Loggings__Correlation__GenerateIfMissing=true

      # AllowedHosts
      - AllowedHosts=*

      # ⚠️ SECRETS: Configure in docker-compose.override.yml (NOT in Git)
      # DO NOT add sensitive values here - this file is tracked by Git
    
    volumes:
      # Persist logs
      - controlpeso-logs:/app/logs

      # Persist Data Protection keys (antiforgery tokens, authentication cookies)
      - controlpeso-keys:/app/keys

      # Persist user avatars (uploaded profile pictures)
      - controlpeso-avatars:/app/wwwroot/uploads

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - controlpeso-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:8080/health)\" = \"200\" ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      com.controlpeso.service: "web"
      com.controlpeso.version: "1.0.0"

# ============================================
# Networks
# ============================================
networks:
  controlpeso-network:
    driver: bridge
    name: controlpeso-network

# ============================================
# Volumes
# ============================================
volumes:
  # PostgreSQL data persistence
  controlpeso-pgdata:
    driver: local
    name: controlpeso-pgdata

  # Logs persistence
  controlpeso-logs:
    driver: local
    name: controlpeso-logs

  # Data Protection keys persistence (antiforgery, auth cookies)
  controlpeso-keys:
    driver: local
    name: controlpeso-keys

  # User avatars persistence (uploaded profile pictures)
  controlpeso-avatars:
    driver: local
    name: controlpeso-avatars
